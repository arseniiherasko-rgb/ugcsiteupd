<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" content="UGC">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23000'/%3E%3Cpolygon points='70,55 70,125 130,90' fill='%23fff'/%3E%3C/svg%3E">
<title>UGC</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    width: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    background: #000;
    color: #fff;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .device-wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  .device {
    position: relative;
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #000;
  }
  @media (min-width: 600px) {
    .device {
      width: 390px;
      height: 800px;
      max-height: 95vh;
      border-radius: 48px;
      box-shadow: 0 0 0 11px #1a1a1a, 0 0 0 13px #2a2a2a, 0 30px 80px rgba(0,0,0,0.5);
    }
    .device::before {
      content: "";
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 30px;
      background: #1a1a1a;
      border-radius: 20px;
      z-index: 100;
      pointer-events: none;
    }
  }

  .screen {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    animation: fadeIn 0.35s ease;
  }
  .screen.active { display: flex; }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .gallery-screen {
    background: linear-gradient(160deg, #1a0b2e 0%, #0a0418 100%);
  }
  .gallery-screen::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(236, 72, 153, 0.18) 0%, transparent 45%),
      radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 45%);
    pointer-events: none;
  }

  .gallery-header {
    padding: calc(env(safe-area-inset-top, 0) + 36px) 22px 18px;
    flex-shrink: 0;
    text-align: center;
    position: relative;
    z-index: 1;
  }
  @media (min-width: 600px) {
    .gallery-header { padding-top: 72px; }
  }
  .gallery-title {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    line-height: 1.1;
    background: linear-gradient(135deg, #fff 0%, #f9a8d4 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .gallery-grid {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 14px;
    padding: 14px 22px calc(env(safe-area-inset-bottom, 0) + 28px);
    min-height: 0;
    position: relative;
    z-index: 1;
  }

  .actress-card {
    position: relative;
    border-radius: 22px;
    overflow: hidden;
    cursor: pointer;
    background: rgba(255,255,255,0.06);
    border: 1.5px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 14px 38px rgba(0,0,0,0.4);
    transition: transform 0.25s cubic-bezier(.4, 1.2, .4, 1);
  }
  .actress-card:active { transform: scale(0.95); }

  .actress-photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: linear-gradient(135deg, #2d1b4e 0%, #1a0b2e 100%);
  }

  .actress-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom,
      transparent 0%,
      transparent 55%,
      rgba(0,0,0,0.85) 100%);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 12px 14px;
  }

  .actress-name {
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }

  .video-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
    opacity: 0;
    transition: opacity 0.15s ease-in-out;
    pointer-events: none;
  }
  .video-layer.active { opacity: 1; }

  /* === Choice buttons — liquid glass === */
  .choices {
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom, 0) + 40px);
    left: 0;
    right: 0;
    padding: 0 22px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 20;
    opacity: 0;
    transform: translateY(40px);
    transition: opacity 0.5s ease, transform 0.5s cubic-bezier(.34, 1.56, .64, 1);
    pointer-events: none;
  }
  .choices.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .choices.hiding {
    opacity: 0;
    transform: translateY(20px);
    pointer-events: none;
  }

  .choice-btn {
    width: 100%;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1.5px solid rgba(255, 255, 255, 0.3);
    color: #fff;
    border-radius: 999px;
    padding: 18px 22px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.3px;
    cursor: pointer;
    font-family: inherit;
    box-shadow:
      0 8px 24px rgba(0, 0, 0, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.25);
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    transition: all 0.2s ease;
    animation: btnIn 0.5s cubic-bezier(.34, 1.56, .64, 1) backwards;
  }
  .choices.show .choice-btn:nth-child(1) { animation-delay: 0.0s; }
  .choices.show .choice-btn:nth-child(2) { animation-delay: 0.12s; }
  .choices.show .choice-btn:nth-child(3) { animation-delay: 0.24s; }
  @keyframes btnIn {
    from { opacity: 0; transform: translateY(20px) scale(0.9); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .choice-btn:active {
    transform: scale(0.96);
    background: rgba(255, 255, 255, 0.25);
  }

  /* Back button - top left */
  .back-btn {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0) + 16px);
    left: 16px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 30;
    transition: all 0.2s ease;
    opacity: 0;
    pointer-events: none;
  }
  .back-btn.show {
    opacity: 1;
    pointer-events: auto;
  }
  .back-btn:active { transform: scale(0.9); background: rgba(0,0,0,0.7); }
  .back-btn svg { width: 20px; height: 20px; }
  @media (min-width: 600px) {
    .back-btn { top: 56px; }
  }
</style>
</head>
<body>

<div class="device-wrap">
  <div class="device">

    <!-- SCREEN 1: Gallery 2x2 -->
    <div class="screen active" id="screen-gallery">
      <div class="gallery-screen" style="position: absolute; inset: 0; display: flex; flex-direction: column;">
        <div class="gallery-header">
          <div class="gallery-title">Choose your AI Agent</div>
        </div>
        <div class="gallery-grid" id="galleryGrid"></div>
      </div>
    </div>

    <!-- SCREEN 2: Player -->
    <div class="screen" id="screen-player">
      <video class="video-layer active" id="videoA" playsinline webkit-playsinline preload="auto"></video>
      <video class="video-layer" id="videoB" playsinline webkit-playsinline preload="auto"></video>

      <button class="back-btn" id="backBtn" onclick="goBackToGallery()" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>

      <div class="choices" id="choices">
        <button class="choice-btn" onclick="playReaction('dance')">💃 Dance for me</button>
        <button class="choice-btn" onclick="playReaction('kiss')">💋 Blow a kiss</button>
        <button class="choice-btn" onclick="playReaction('around')">🔄 Turn around</button>
      </div>
    </div>

  </div>
</div>

<script>
  // ============================================
  // CONFIG
  // ============================================

  // Время в мс до появления кнопок (подгони под длину хука)
  const SHOW_BUTTONS_AFTER_MS = 2300;

  // 4 актрисы с рандомными именами
  const ACTRESSES = [
    { id: "actress1", name: "Luna" },
    { id: "actress2", name: "Aria" },
    { id: "actress3", name: "Zoe"  },
    { id: "actress4", name: "Mila" }
  ];

  // ============================================
  // LOGIC
  // ============================================

  const videoA = document.getElementById("videoA");
  const videoB = document.getElementById("videoB");
  const choices = document.getElementById("choices");
  const backBtn = document.getElementById("backBtn");
  const galleryGrid = document.getElementById("galleryGrid");

  let activeVideo = videoA;
  let inactiveVideo = videoB;
  let showButtonsTimer = null;
  let currentActress = null;

  // Build gallery cards
  ACTRESSES.forEach((a) => {
    const card = document.createElement("div");
    card.className = "actress-card";
    card.innerHTML = `
      <img class="actress-photo" src="videos/photos/${a.id}.png" alt="${a.name}"
           onerror="this.style.display='none'; this.parentElement.style.background='linear-gradient(135deg, #2d1b4e 0%, #ec4899 100%)';">
      <div class="actress-overlay">
        <div class="actress-name">${a.name}</div>
      </div>
    `;
    card.addEventListener("click", () => selectActress(a));
    galleryGrid.appendChild(card);
  });

  function showScreen(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  }

  function selectActress(actress) {
    currentActress = actress;

    // Reset UI
    choices.classList.remove("show", "hiding");
    backBtn.classList.add("show");
    activeVideo.classList.add("active");
    inactiveVideo.classList.remove("active");

    showScreen("screen-player");

    // Start video IMMEDIATELY within click handler — preserves user gesture for iOS audio autoplay
    activeVideo.src = `videos/${actress.id}/ugchook.mp4`;
    activeVideo.muted = false;
    activeVideo.volume = 1.0;
    activeVideo.currentTime = 0;

    const playPromise = activeVideo.play();
    if (playPromise && playPromise.catch) {
      playPromise.catch(err => {
        // If autoplay with sound fails on some browser, fallback to muted
        console.warn("Autoplay with sound failed, falling back to muted:", err);
        activeVideo.muted = true;
        activeVideo.play().catch(e => console.error("Even muted play failed:", e));
      });
    }

    // Show buttons after configured delay
    if (showButtonsTimer) clearTimeout(showButtonsTimer);
    showButtonsTimer = setTimeout(() => {
      choices.classList.add("show");
    }, SHOW_BUTTONS_AFTER_MS);
  }

  function goBackToGallery() {
    if (showButtonsTimer) {
      clearTimeout(showButtonsTimer);
      showButtonsTimer = null;
    }
    [videoA, videoB].forEach(v => {
      v.pause();
      v.removeAttribute("src");
      v.load();
    });
    activeVideo = videoA;
    inactiveVideo = videoB;
    currentActress = null;
    showScreen("screen-gallery");
  }

  function playReaction(key) {
    if (!currentActress) return;
    const fileMap = {
      dance:  "ugcdance.mp4",
      kiss:   "ugckiss.mp4",
      around: "ugcaround.mp4"
    };
    const src = `videos/${currentActress.id}/${fileMap[key]}`;

    choices.classList.remove("show");
    choices.classList.add("hiding");
    if (showButtonsTimer) {
      clearTimeout(showButtonsTimer);
      showButtonsTimer = null;
    }

    inactiveVideo.src = src;
    inactiveVideo.muted = false;
    inactiveVideo.volume = 1.0;
    inactiveVideo.currentTime = 0;

    const onReady = () => {
      inactiveVideo.removeEventListener("canplay", onReady);
      inactiveVideo.play().then(() => {
        inactiveVideo.classList.add("active");
        activeVideo.classList.remove("active");

        setTimeout(() => {
          activeVideo.pause();
          activeVideo.removeAttribute("src");
          activeVideo.load();
          const tmp = activeVideo;
          activeVideo = inactiveVideo;
          inactiveVideo = tmp;
        }, 200);
      }).catch(err => {
        console.error("Play failed:", err);
      });
    };
    inactiveVideo.addEventListener("canplay", onReady);
    inactiveVideo.load();
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      activeVideo.pause();
    } else if (currentActress) {
      activeVideo.play().catch(() => {});
    }
  });
</script>
</body>
</html>
